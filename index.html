<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d7c4f">
<title>AKHADA — The Lifestyle Gym</title>
<style>
html,body{margin:0;padding:0;width:100%;min-height:100%;overflow-x:hidden;background:#f4f5f7}
#akhadaLoader{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;color:#555;font-weight:800}
</style>
</head>
<body>
<div id="akhadaLoader">Loading AKHADA…</div>
<script>
(function(){
'use strict';
var OLD_URL='https://raw.githubusercontent.com/satishbr1432-cyber/AKHADA-GYM-DEMO/eaab56e08500a3991f408e0195046ead1f723cd7/index.html';

function esc(v){return String(v==null?'':v).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c})}
function read(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function allLocal(){var o={};try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);try{o[k]=JSON.parse(localStorage.getItem(k))}catch(e){o[k]=localStorage.getItem(k)}}}catch(e){}return o}
function pickDiet(member){
  var a=allLocal(), keys=Object.keys(a), out=[];
  keys.forEach(function(k){
    if(!/diet/i.test(k))return;
    var v=a[k];
    if(!v)return;
    var s='';try{s=JSON.stringify(v)}catch(e){s=String(v)}
    if(!member || s.toLowerCase().indexOf(String(member).toLowerCase())>=0 || /assignment|draft|plan|option/i.test(k))out.push({key:k,value:v});
  });
  return out;
}
function flattenFoods(v){
  var foods=[];
  function walk(x,path){
    if(x==null)return;
    if(Array.isArray(x)){x.forEach(function(y){walk(y,path)});return}
    if(typeof x==='object'){
      var name=x.name||x.food||x.foodName||x.item||x.title||x.label;
      var grams=x.grams||x.qty||x.quantity||x.amount||x.weight;
      if(name && typeof name==='string' && name.length<120 && !/plan|goal|member|calorie|diet/i.test(name))foods.push({name:name,grams:grams});
      Object.keys(x).forEach(function(k){if(!/name|food|foodName|item|title|label|grams|qty|quantity|amount|weight/i.test(k))walk(x[k],path+'.'+k)});
    }
  }
  walk(v,'');
  var seen={};return foods.filter(function(f){var k=f.name+'|'+(f.grams||'');if(seen[k])return false;seen[k]=1;return true});
}
function currentMemberFromText(){
  var els=['dietMember','dietMemberSelect','workingDietMember','assignedDietMember','memberDietSelect'];
  for(var i=0;i<els.length;i++){var e=document.getElementById(els[i]);if(e&&e.value)return e.value}
  var s=document.querySelector('#diet select');if(s&&s.value)return s.value;
  return '';
}
function pdfWindow(title,member,type){
  var w=window.open('','_blank','width=900,height=900');
  if(!w){try{window.toast&&window.toast('Please allow pop-ups for PDF')}catch(e){}return null}
  var records=pickDiet(member), foods=[];
  records.forEach(function(r){foods=foods.concat(flattenFoods(r.value))});
  var seen={};foods=foods.filter(function(f){var k=f.name+'|'+f.grams;if(seen[k])return false;seen[k]=1;return true});
  var html='<!doctype html><html><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>body{font-family:Arial,sans-serif;padding:28px;color:#111}h1{margin:0 0 6px}h2{margin-top:24px;border-bottom:1px solid #ddd;padding-bottom:6px}.meta{padding:14px;border:1px solid #ddd;border-radius:10px;margin:18px 0}.food{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:9px 0}.muted{color:#666}@media print{body{padding:16px}}</style></head><body>';
  html+='<h1>AKHADA</h1><h2>'+esc(member||'Diet Plan')+'</h2><div class="meta"><b>Plan:</b> '+esc(type||'Diet Plan')+'<br><b>Generated:</b> '+esc(new Date().toLocaleDateString('en-IN'))+'</div>';
  if(foods.length){html+='<h2>Recommended Food</h2>'+foods.map(function(f){return '<div class="food"><span>'+esc(f.name)+'</span><b>'+esc(f.grams||'')+(f.grams?' g':'')+'</b></div>'}).join('')}
  else html+='<p class="muted">Food details are stored in the current diet plan and will be shown here when available.</p>';
  html+='<script>window.onload=function(){setTimeout(function(){window.print()},250)}<\\/script></body></html>';
  w.document.open();w.document.write(html);w.document.close();return w;
}
function installPatch(){
  try{
    var st=document.createElement('style');st.id='akhada-final-layout-fix';st.textContent='html,body{width:100%!important;min-width:0!important;margin:0!important;padding:0!important;overflow-x:hidden!important}.app{width:100%!important;max-width:none!important}.main{width:100%!important;max-width:none!important;box-sizing:border-box!important;margin-right:0!important}.page{width:100%!important;max-width:none!important}';document.head.appendChild(st);
  }catch(e){}
  function btnText(b){return (b.textContent||'').replace(/\\s+/g,' ').trim().toLowerCase()}
  function wireAdd(){
    document.querySelectorAll('button').forEach(function(b){
      if(b.dataset.akhadaAddFix)return;
      if(btnText(b).indexOf('add member')>=0){
        b.dataset.akhadaAddFix='1';
        b.addEventListener('click',function(e){
          setTimeout(function(){
            var modal=document.querySelector('.modalback.open,.modalback[style*="display: flex"],#memberModal,#addMemberModal');
            if(modal)return;
            try{if(typeof window.openModal==='function'){window.openModal('member');return}}catch(x){}
            var candidates=['member','members'];
            for(var i=0;i<candidates.length;i++){var el=document.getElementById(candidates[i]);if(el){el.classList.add('active');el.style.display='block';break}}
          },0);
        },false);
      }
    });
  }
  function clearDietForm(){
    setTimeout(function(){
      var roots=['#diet','#dietPlan','[data-page="diet"]'];
      roots.forEach(function(sel){var root=document.querySelector(sel);if(root){root.querySelectorAll('input,textarea').forEach(function(e){if(!e.readOnly&&!e.disabled)e.value=''});root.querySelectorAll('select').forEach(function(e){if(e.options.length)e.selectedIndex=0});root.querySelectorAll('[data-selected],[data-food-selected]').forEach(function(e){e.removeAttribute('data-selected');e.removeAttribute('data-food-selected')});}});
    },50);
  }
  function wireDietSave(){
    document.querySelectorAll('button').forEach(function(b){
      if(b.dataset.akhadaDietFix)return;
      if(btnText(b).indexOf('save weekly diet')>=0){
        b.dataset.akhadaDietFix='1';
        b.addEventListener('click',function(){setTimeout(clearDietForm,120)},true);
      }
    });
  }
  function wirePlanPDF(){
    document.querySelectorAll('button,a').forEach(function(el){
      if(el.dataset.akhadaPdfFix)return;
      var t=btnText(el);if(!/download/.test(t)||!/diet|workout|plan/.test(t))return;
      el.dataset.akhadaPdfFix='1';
      el.addEventListener('click',function(e){
        var member=currentMemberFromText();
        if(/diet/.test(t)){e.preventDefault();e.stopImmediatePropagation();pdfWindow('AKHADA Diet Plan',member,'Diet Plan');}
      },true);
    });
  }
  function overduePdf(){
    var member='';
    var pop=document.querySelector('.modalback.open')||document.body;
    var text=pop.textContent||'';
    var m=text.match(/Overdue Members/i);
    if(!m)return;
    var rows=[];
    var cards=pop.querySelectorAll('.row,.memberrow,li,[data-member]');cards.forEach(function(c){var s=(c.textContent||'').replace(/\\s+/g,' ').trim();if(s&&/₹/.test(s))rows.push(s)});
    var w=window.open('','_blank','width=900,height=900');if(!w)return;
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>AKHADA Overdue Members</title><style>body{font-family:Arial;padding:28px}h1{margin-bottom:20px}.r{padding:12px;border-bottom:1px solid #ddd}</style></head><body><h1>AKHADA — Overdue Members</h1>'+rows.map(function(r){return '<div class="r">'+esc(r)+'</div>'}).join('')+'<script>window.onload=function(){setTimeout(function(){window.print()},250)}<\\/script></body></html>');w.document.close();
  }
  function addOverdueButton(){
    var pops=document.querySelectorAll('.modalback,.modal,[role="dialog"]');pops.forEach(function(p){
      if(!/overdue members/i.test(p.textContent||''))return;
      if(p.querySelector('[data-akhada-overdue-pdf]'))return;
      var b=document.createElement('button');b.type='button';b.className='btn light';b.dataset.akhadaOverduePdf='1';b.textContent='⬇ PDF';b.style.marginTop='12px';b.onclick=overduePdf;
      var host=p.querySelector('.modal-actions')||p.querySelector('.modalhead')||p;b.className+=' greenbtn';host.appendChild(b);
    });
  }
  function tick(){wireAdd();wireDietSave();wirePlanPDF();addOverdueButton()}
  tick();setInterval(tick,800);
}
fetch(OLD_URL,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('Existing AKHADA build unavailable');return r.text()}).then(function(source){
  document.open();document.write(source);document.close();
  setTimeout(installPatch,300);
}).catch(function(err){document.getElementById('akhadaLoader').innerHTML='<div style="padding:24px;text-align:center;font-family:system-ui"><h2>AKHADA could not load</h2><p>'+esc(err.message)+'</p><p>Refresh after internet is available.</p></div>'});
})();
</script>
</body>
</html>
