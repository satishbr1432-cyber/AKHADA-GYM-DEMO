<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d7c4f">
<title>AKHADA — The Lifestyle Gym</title>
<style>
html,body{margin:0;padding:0;width:100%;min-height:100%;overflow-x:hidden;background:#f4f5f7}
#akhadaLoader{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;color:#555;font-weight:800}
</style>
</head>
<body>
<div id="akhadaLoader">Loading AKHADA…</div>
<script>
(function(){
'use strict';
var OLD_URL="https://raw.githubusercontent.com/satishbr1432-cyber/AKHADA-GYM-DEMO/eaab56e08500a3991f408e0195046ead1f723cd7/index.html";
var FINAL_PATCH="(function(){\n'use strict';\n\nconst esc2 = v => String(v==null?'':v).replace(/[&<>\\\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c));\nconst J = (k,d=[]) => { try { const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); } catch(e){ return d; } };\nconst SS = (k,v) => { try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;} };\nconst clean = v => String(v==null?'':v).replace(/\\s+/g,' ').trim();\nconst toast2 = msg => { try{ if(typeof window.toast==='function') window.toast(msg); else alert(msg); }catch(e){ alert(msg); } };\n\n/* ---------- FULL WIDTH / REMOVE SOURCE-TEXT / FONT GARBAGE ---------- */\n(function layout(){\n  const s=document.createElement('style');\n  s.id='akhada-v60-final-css';\n  s.textContent=`\n    html,body{width:100%!important;max-width:none!important;margin:0!important;padding:0!important;overflow-x:hidden!important}\n    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif!important}\n    .main{width:100%!important;max-width:none!important;margin-left:0!important;box-sizing:border-box!important}\n    @media(max-width:767px){.main{padding-left:0!important;padding-right:0!important;padding-bottom:82px!important}.page{width:100%!important}.card{box-sizing:border-box!important}}\n    .akhada-code-text,.akhada-source-text{display:none!important}\n  `;\n  document.head.appendChild(s);\n})();\n\n/* ---------- MEMBER IDs ---------- */\nfunction ensureMemberIds(){\n  let rows=J('akhadaMembers',[]); if(!Array.isArray(rows)) rows=[];\n  let max=0; rows.forEach(m=>{const x=String(m&&m.gymId||'').match(/^AKH-M-(\\d+)$/i);if(x)max=Math.max(max,+x[1]||0)});\n  const used={}; rows.forEach(m=>{if(m&&m.gymId)used[m.gymId]=1});\n  let changed=false;\n  rows.forEach(m=>{\n    if(!m)return;\n    if(!m.gymId){ do{max++;m.gymId='AKH-M-'+String(max).padStart(4,'0')}while(used[m.gymId]); used[m.gymId]=1; changed=true; }\n  });\n  if(changed)SS('akhadaMembers',rows);\n  try{window.members=rows}catch(e){}\n  return rows;\n}\n\nfunction wrapMemberSave(){\n  ['saveAkhadaMemberV71','saveAkhadaMemberV60','saveAkhadaMember'].forEach(name=>{\n    const old=window[name];\n    if(typeof old!=='function'||old.__akhadaFinal)return;\n    function wrapped(){\n      const idEl=document.getElementById('fMemberGymId');\n      ensureMemberIds();\n      if(idEl && !idEl.value){\n        const rows=J('akhadaMembers',[]); let max=0;rows.forEach(m=>{const x=String(m.gymId||'').match(/AKH-M-(\\d+)/);if(x)max=Math.max(max,+x[1]||0)});idEl.value='AKH-M-'+String(max+1).padStart(4,'0');\n      }\n      const r=old.apply(this,arguments);\n      ensureMemberIds();\n      return r;\n    }\n    wrapped.__akhadaFinal=true; window[name]=wrapped;\n  });\n}\n\n/* ---------- ADD MEMBER ---------- */\nfunction fixAddMember(){\n  document.querySelectorAll('button,a,[role=\"button\"]').forEach(b=>{\n    if(b.dataset.akhadaFinalAdd)return;\n    if(!/add member/i.test(clean(b.textContent)))return;\n    b.dataset.akhadaFinalAdd='1';\n    b.addEventListener('click',function(e){\n      if(typeof window.openModal==='function'){\n        e.preventDefault();e.stopPropagation();\n        try{window.openModal('member');}catch(x){console.error(x)}\n      }\n    },true);\n  });\n}\n\n/* ---------- DIET: SAVE + CLEAR + ASSIGNMENT ---------- */\nfunction clone(v){try{return JSON.parse(JSON.stringify(v))}catch(e){return v}}\nfunction getDietMember(){\n  const ids=['dayDietMember','verifiedDietMember','dietMember'];\n  for(const id of ids){const e=document.getElementById(id);if(e&&e.value)return e.value;}\n  return '';\n}\nfunction clearDietEditor(){\n  try{ if(typeof window.akhadaDietDraft!=='undefined') window.akhadaDietDraft={}; }catch(e){}\n  try{ if(typeof window.clearWorkingDiet==='function' && !window.clearWorkingDiet.__finalClear){ window.clearWorkingDiet(); } }catch(e){}\n  ['dayDietMember','dayDietCalories','dayDietType','dayDietGoal','verifiedDietMember','verifiedDietCalories','verifiedDietType','verifiedDietGoal','dietMember','dietCalories','dietType','dietGoal'].forEach(id=>{\n    const e=document.getElementById(id); if(!e)return;\n    if(e.tagName==='SELECT')e.selectedIndex=0; else e.value='';\n  });\n  try{if(typeof window.renderAllWorkingDiet==='function')window.renderAllWorkingDiet()}catch(e){}\n  try{if(typeof window.renderDayDiet==='function')window.renderDayDiet()}catch(e){}\n  document.querySelectorAll('#diet input[type=\"number\"],#diet input[type=\"text\"],#diet textarea').forEach(e=>{if(e.id&&!/search/i.test(e.id))e.value=''});\n}\nfunction wrapDietSave(){\n  const old=window.saveWorkingDiet;\n  if(typeof old==='function'&&!old.__akhadaFinal){\n    function save(){\n      const member=document.getElementById('dayDietMember')?.value||'';\n      if(!member){toast2('Select a member first.');return;}\n      const r=old.apply(this,arguments);\n      setTimeout(()=>{\n        ensureMemberIds();\n        clearDietEditor();\n        toast2('Weekly diet saved successfully. The editor is ready for a new diet.');\n      },80);\n      return r;\n    }\n    save.__akhadaFinal=true;window.saveWorkingDiet=save;\n  }\n  const old2=window.saveDayDiet;\n  if(typeof old2==='function'&&!old2.__akhadaFinal){\n    function save2(){const r=old2.apply(this,arguments);setTimeout(clearDietEditor,80);return r;}\n    save2.__akhadaFinal=true;window.saveDayDiet=save2;\n  }\n}\n\n/* ---------- DIET DATA NORMALISATION ---------- */\nfunction foodListFrom(v,out=[]){\n  const add=(n,g,c)=>{n=clean(n);if(!n||/no food assigned/i.test(n))return;out.push({name:n,grams:g==null?'':g,calories:c==null?'':c});};\n  const walk=x=>{\n    if(x==null)return;\n    if(Array.isArray(x)){x.forEach(walk);return;}\n    if(typeof x!=='object')return;\n    const n=x.name||x.foodName||x.food||x.itemName||x.item||x.title;\n    const g=x.grams??x.qty??x.quantity??x.amount??x.weight??'';\n    const c=x.calories??x.kcal??x.cal??'';\n    if(n)add(n,g,c);\n    Object.keys(x).forEach(k=>{if(!/^(name|foodName|food|itemName|item|title|grams|qty|quantity|amount|weight|calories|kcal|cal)$/i.test(k))walk(x[k]);});\n  };\n  walk(v);\n  const seen={};return out.filter(f=>{const k=f.name.toLowerCase()+'|'+f.grams+'|'+f.calories;if(seen[k])return false;seen[k]=1;return true});\n}\nfunction assigned(){return J('akhada_assigned_plans',{});}\nfunction planForFinal(name){return assigned()[name]||{};}\n\nfunction planTextFinal(p,kind){\n  if(!p)return 'No '+kind+' plan assigned.';\n  if(kind==='diet'){\n    const d=p.weeklyDiet||p.diet;if(!d)return 'No diet plan assigned.';\n    let out=[`Diet Goal: ${d.goal||'\u2014'}`,`Type: ${d.type||'\u2014'}`,`Calories: ${d.calories||d.kcal||'\u2014'} kcal`];\n    const foods=foodListFrom(d.days||d.weeklyDiet||d);\n    if(foods.length){out.push('Recommended Food:');foods.forEach(f=>out.push(`\u2022 ${f.name}${f.grams!==''?' \u2014 '+f.grams+' g':''}${f.calories!==''?' \u2014 '+f.calories+' kcal':''}`));}\n    return out.join('\\n');\n  }\n  const w=p.weeklyWorkout||p.workout;if(!w)return 'No workout plan assigned.';\n  let out=[`Workout Goal: ${w.goal||'\u2014'}`,`Level: ${w.level||'\u2014'}`];\n  Object.entries(w.days||{}).forEach(([day,v])=>{if(v&&(v.plan||v.exercises?.length))out.push(`${day}: ${v.plan||''}${v.exercises?.length?' \u2014 '+v.exercises.join(', '):''}`)});\n  return out.join('\\n');\n}\n\n/* ---------- REAL PRINT/PDF ---------- */\nfunction printPDF(title,body){\n  const w=window.open('','_blank','width=900,height=900');\n  if(!w){toast2('Please allow pop-ups for PDF/Print.');return;}\n  const html=`<!doctype html><html><head><meta charset=\"utf-8\"><title>${esc2(title)}</title><style>body{font-family:Arial,sans-serif;padding:30px;color:#111;max-width:900px;margin:auto}h1{margin:0 0 4px}h2{margin:18px 0 8px;border-bottom:1px solid #ddd;padding-bottom:6px}.meta{border:1px solid #ddd;border-radius:10px;padding:12px;margin:14px 0}.item{padding:8px 0;border-bottom:1px solid #eee;white-space:pre-wrap}@media print{body{padding:12px}.no-print{display:none}}</style></head><body><h1>AKHADA</h1><h2>${esc2(title)}</h2><div class=\"meta\">${String(body||'').split('\\n').map(x=>`<div class=\"item\">${esc2(x)}</div>`).join('')}</div><p class=\"no-print\" style=\"color:#666;font-size:12px\">Use the iPhone share/print sheet and choose Save to Files / PDF.</p><script>window.onload=function(){setTimeout(function(){window.print()},250)}<\\/script></body></html>`;\n  w.document.open();w.document.write(html);w.document.close();\n}\nwindow.akhadaFinalPrintPDF=printPDF;\n\n/* ---------- MEMBER SERVICES: FOOD + WORKOUT + PDF ---------- */\nfunction renderStaffServiceFinal(){\n  const name=document.getElementById('staffSvcMember')?.value;\n  const box=document.getElementById('staffSvcBody'); if(!box)return;\n  if(!name){box.innerHTML='<p class=\"muted\">Select a member.</p>';return;}\n  ensureMemberIds(); const m=J('akhadaMembers',[]).find(x=>x.name===name)||{}; const p=planForFinal(name);\n  const diet=p.weeklyDiet||p.diet; const workout=p.weeklyWorkout||p.workout;\n  const dietFoods=foodListFrom(diet?.days||diet?.weeklyDiet||diet);\n  const workoutText=planTextFinal(p,'workout');\n  const dietText=planTextFinal(p,'diet');\n  const foodHTML=dietFoods.length?`<div class=\"tablewrap\"><table><thead><tr><th>Food</th><th>Quantity</th><th>Calories</th></tr></thead><tbody>${dietFoods.map(f=>`<tr><td>${esc2(f.name)}</td><td>${esc2(f.grams||'\u2014')}${f.grams?' g':''}</td><td>${esc2(f.calories||'\u2014')}</td></tr>`).join('')}</tbody></table></div>`:'<p class=\"muted\">No food items saved in this diet.</p>';\n  box.innerHTML=`<div class=\"grid2\"><div class=\"card\"><h3>Member Profile</h3>${[['Name',m.name],['Gym ID',m.gymId||'\u2014'],['Mobile',m.phone||'\u2014'],['Plan',m.plan||'\u2014'],['Joining',m.start||m.joiningDate||'\u2014'],['Expiry',m.expiry||'\u2014'],['Status',m.status||'\u2014'],['Due',m.due||'\u20b90']].map(x=>`<div class=\"row\"><span>${esc2(x[0])}</span><b>${esc2(x[1])}</b></div>`).join('')}</div><div class=\"card\"><h3>Assigned Plans</h3><div class=\"row\"><span>Workout</span><b>${workout?'Assigned':'Not assigned'}</b></div><div class=\"row\"><span>Diet</span><b>${diet?'Assigned':'Not assigned'}</b></div></div></div><div class=\"grid2\"><div class=\"card\"><h3>Workout Plan</h3><pre style=\"white-space:pre-wrap;font:inherit\">${esc2(workoutText)}</pre><div class=\"actions\"><button class=\"btn greenbtn\" type=\"button\" data-final-pdf=\"workout\">Download PDF</button><button class=\"btn light\" type=\"button\" data-final-print=\"workout\">Print</button></div></div><div class=\"card\"><h3>Diet Plan</h3><pre style=\"white-space:pre-wrap;font:inherit\">${esc2(dietText)}</pre>${foodHTML}<div class=\"actions\"><button class=\"btn greenbtn\" type=\"button\" data-final-pdf=\"diet\">Download PDF</button><button class=\"btn light\" type=\"button\" data-final-print=\"diet\">Print</button></div></div></div>`;\n  box.querySelector('[data-final-pdf=\"diet\"]')?.addEventListener('click',()=>printPDF(name+' \u2014 Diet Plan',dietText));\n  box.querySelector('[data-final-print=\"diet\"]')?.addEventListener('click',()=>printPDF(name+' \u2014 Diet Plan',dietText));\n  box.querySelector('[data-final-pdf=\"workout\"]')?.addEventListener('click',()=>printPDF(name+' \u2014 Workout Plan',workoutText));\n  box.querySelector('[data-final-print=\"workout\"]')?.addEventListener('click',()=>printPDF(name+' \u2014 Workout Plan',workoutText));\n}\nwindow.renderStaffService=renderStaffServiceFinal;\n\n/* ---------- OVERDUE DETAIL WITH PDF ---------- */\nfunction overduePDF(){\n  ensureMemberIds(); const t=new Date();t.setHours(0,0,0,0);\n  const rows=J('akhadaMembers',[]).filter(m=>{const s=m.expiryISO||m.expiry;const d=s?new Date(s):null;return d&&!isNaN(d)&&d<t;});\n  const text=rows.length?rows.map(m=>`${m.name||'Member'} \u2014 Expired: ${m.expiry||m.expiryISO||'\u2014'} \u2014 Due: ${m.due||'\u20b90'} \u2014 Gym ID: ${m.gymId||'\u2014'}`).join('\\n'):'No overdue/expired members.';\n  printPDF('AKHADA \u2014 Overdue Members',text);\n}\nfunction patchBillingDetail(){\n  const old=window.detail;\n  if(typeof old!=='function'||old.__akhadaFinal)return;\n  function detailFinal(title,kind){\n    const r=old.apply(this,arguments);\n    if(kind==='overdue')setTimeout(()=>{\n      const host=document.getElementById('akhadaBillingModal');if(!host)return;\n      const body=host.querySelector('#abmBody');if(!body||body.querySelector('[data-final-overdue-pdf]'))return;\n      const b=document.createElement('div');b.className='actions';b.style.marginTop='14px';b.innerHTML='<button class=\"btn greenbtn\" type=\"button\" data-final-overdue-pdf=\"1\">\u2b07 Download PDF</button><button class=\"btn light\" type=\"button\">Print</button>';\n      body.appendChild(b);b.querySelector('[data-final-overdue-pdf]').onclick=overduePDF;b.querySelector('.light').onclick=overduePDF;\n    },30);\n    return r;\n  }\n  detailFinal.__akhadaFinal=true;window.detail=detailFinal;\n}\n\n/* ---------- REMOVE THE OLD TXT DOWNLOAD BEHAVIOUR ---------- */\nwindow.downloadText=function(filename,text){\n  if(/diet|workout/i.test(filename)){printPDF(filename.replace(/\\.txt$/i,''),text);return;}\n  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);\n};\n\nfunction finalInit(){\n  ensureMemberIds();wrapMemberSave();wrapDietSave();patchBillingDetail();fixAddMember();\n  try{if(typeof window.renderMembers==='function')window.renderMembers()}catch(e){}\n  try{if(typeof window.renderStaffService==='function'&&document.getElementById('staffSvcMember')?.value)window.renderStaffService()}catch(e){}\n}\n\nfinalInit();\nsetInterval(()=>{try{ensureMemberIds();wrapMemberSave();wrapDietSave();patchBillingDetail();fixAddMember()}catch(e){}},800);\n})();\n";
fetch(OLD_URL,{cache:'no-store'}).then(function(r){
  if(!r.ok) throw new Error('Existing AKHADA build unavailable');
  return r.text();
}).then(function(source){
  var injected = source.replace(/<\/body>/i,
    '<script id="akhada-final-patch">'+FINAL_PATCH.replace(/<\/script/gi,'<\\/script')+'<\\/script></body>');
  document.open();
  document.write(injected);
  document.close();
}).catch(function(err){
  document.getElementById('akhadaLoader').innerHTML =
    '<div style="padding:24px;text-align:center;font-family:system-ui"><h2>AKHADA could not load</h2><p>'+
    String(err.message).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]})+
    '</p><p>Refresh after internet is available.</p></div>';
});
})();
</script>
</body>
</html>
